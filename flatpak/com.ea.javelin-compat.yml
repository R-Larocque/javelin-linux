app-id: com.ea.javelin-compat
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm20
command: steam-launch-wrapper.sh

finish-args:
  - --filesystem=~/.local/share/Steam:create
  - --filesystem=~/.steam:create
  - --filesystem=~/Games:create
  - --filesystem=/sys/fs/bpf:rw
  - --filesystem=/sys/kernel/btf:ro
  - --filesystem=/run/javelin:create
  - --device=all
  - --socket=session-bus
  - --share=network
  - --allow=multiarch
  - --allow=devel
  - --talk-name=org.freedesktop.PolicyKit1

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - /share/doc
  - '*.la'
  - '*.a'

modules:
  - name: libbpf
    buildsystem: simple
    build-commands:
      - make -C src PREFIX=/app LIBDIR=lib install
    sources:
      - type: archive
        url: https://github.com/libbpf/libbpf/archive/refs/tags/v1.3.0.tar.gz
        sha256: 11db86acd627e468bc48b7258c1130aba41a12c4d364f78e184fd2f5a913d861

  - name: javelin-linux-compat
    build-options:
      env:
        PKG_CONFIG_PATH: /app/lib/pkgconfig:/app/lib64/pkgconfig
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DJVL_BUILD_TESTS=OFF
      - -DCMAKE_INSTALL_PREFIX=/app
    sources:
      - type: dir
        path: ..

  - name: wrapper-symlink
    buildsystem: simple
    build-commands:
      - install -Dm755 steam-launch-wrapper.sh /app/bin/steam-launch-wrapper.sh
    sources:
      - type: file
        path: ../scripts/steam-launch-wrapper.sh
